<html lang="en">

<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --line: #2a2f3a; --text: #e9ecf1; --muted: #9aa3b2;
    --accent: #3fd18a; --warn: #ffb347; --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, sans-serif; }
  body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { font-size: 16px; margin: 0 0 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  button, select, label.file { font: inherit; font-weight: 600; color: var(--text); background: #232834; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-height: 40px; cursor: pointer; }
  button.primary { background: var(--accent); color: #062014; border-color: transparent; }
  button.rec { background: var(--danger); color: #fff; border-color: transparent; }
  button:disabled { opacity: .45; cursor: default; }
  label.file input { display: none; }
  #status { margin-top: 8px; color: var(--muted); font-size: 13px; min-height: 18px; }
  #stage { position: relative; flex: 1; min-height: 320px; background: #000; overflow: hidden; }
  #stage video, #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #stage video { object-fit: contain; }
  #stage video.mirror { transform: scaleX(-1); }
  #demo { position: absolute; inset: 0; }
  #stats { padding: 10px 12px; border-top: 1px solid var(--line); background: var(--panel); font-size: 13px; color: var(--muted); }
  #stats table { border-collapse: collapse; width: 100%; color: var(--text); }
  #stats th, #stats td { text-align: right; padding: 3px 6px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  #stats th:first-child, #stats td:first-child { text-align: left; }
</style>
<script>
/* rep-engine 0.12.0, inlined by build/build.mjs. Edit engine/, not this copy. */
// ---- engine/core.js ----
// rep-engine core: namespace, landmark indices, small shared helpers.
// Every engine file is a plain script that adds to globalThis.RepEngine,
// so the build step can concatenate them into one inline <script>.
(function (g) {
  'use strict';
  const RE = (g.RepEngine = g.RepEngine || {});

  RE.version = '0.11.0';

  // MediaPipe Pose landmark indices (33-point model). "Left" and "right"
  // are the player's own anatomical sides.
  RE.LM = Object.freeze({
    NOSE: 0,
    L_EAR: 7, R_EAR: 8,
    L_SHOULDER: 11, R_SHOULDER: 12,
    L_ELBOW: 13, R_ELBOW: 14,
    L_WRIST: 15, R_WRIST: 16,
    L_HIP: 23, R_HIP: 24,
    L_KNEE: 25, R_KNEE: 26,
    L_ANKLE: 27, R_ANKLE: 28,
  });

  // Knees-up framing: these must be visible for calibration and signals.
  RE.REQUIRED = Object.freeze([11, 12, 23, 24, 25, 26]);

  RE.LM_NAMES = Object.freeze({
    0: 'nose', 11: 'left shoulder', 12: 'right shoulder', 13: 'left elbow',
    14: 'right elbow', 15: 'left wrist', 16: 'right wrist', 23: 'left hip',
    24: 'right hip', 25: 'left knee', 26: 'right knee', 27: 'left ankle', 28: 'right ankle',
  });

  // Skeleton lines for the debug overlay (upper body, torso, legs).
  RE.CONNECTIONS = Object.freeze([
    [11, 12], [11, 13], [13, 15], [12, 14], [14, 16],
    [11, 23], [12, 24], [23, 24],
    [23, 25], [25, 27], [24, 26], [26, 28],
  ]);

  RE.clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  RE.now = () => (g.performance && g.performance.now ? g.performance.now() : Date.now());

  // Tiny event emitter. on('*', fn) receives (name, payload) for every event.
  RE.createEmitter = function () {
    const handlers = new Map();
    return {
      on(name, fn) {
        if (!handlers.has(name)) handlers.set(name, new Set());
        handlers.get(name).add(fn);
        return () => handlers.get(name).delete(fn);
      },
      emit(name, payload) {
        const set = handlers.get(name);
        if (set) for (const fn of [...set]) safeCall(fn, payload);
        const all = handlers.get('*');
        if (all) for (const fn of [...all]) safeCall(fn, name, payload);
      },
      clear() { handlers.clear(); },
    };
  };

  function safeCall(fn, a, b) {
    try { fn(a, b); } catch (err) { (g.console || { error() {} }).error('[rep-engine] handler error', err); }
  }

  // Storage that never throws: private windows, blocked storage and Node
  // all fall back to an in-memory map for the session.
  RE.storage = (function () {
    const memory = new Map();
    function ls() {
      try { return g.localStorage || null; } catch (_) { return null; }
    }
    return {
      get(key) {
        try { const s = ls(); if (s) { const v = s.getItem(key); if (v !== null) return v; } } catch (_) {}
        return memory.has(key) ? memory.get(key) : null;
      },
      set(key, value) {
        memory.set(key, value);
        try { const s = ls(); if (s) s.setItem(key, value); } catch (_) {}
      },
      remove(key) {
        memory.delete(key);
        try { const s = ls(); if (s) s.removeItem(key); } catch (_) {}
      },
    };
  })();

  // Throttled spoken cues for calibration ("step back", "good").
  RE.speak = (function () {
    let lastText = '';
    let lastAt = 0;
    return function (text, minGapMs = 2500) {
      const synth = g.speechSynthesis;
      if (!synth || typeof g.SpeechSynthesisUtterance !== 'function') return false;
      const t = RE.now();
      if (text === lastText && t - lastAt < minGapMs) return false;
      lastText = text;
      lastAt = t;
      try {
        synth.cancel();
        synth.speak(new g.SpeechSynthesisUtterance(text));
        return true;
      } catch (_) { return false; }
    };
  })();
})(globalThis);

// ---- engine/config.js ----
// Every tunable number lives here. A player profile stores only overrides.
// Values are starting points from the spec, not tested results.
(function (g) {
  'use strict';
  const RE = g.RepEngine;

  const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.1.1';

  RE.defaultConfig = function () {
    return {
      pose: {
        moduleUrl: MP + '/vision_bundle.mjs',
        wasmBase: MP + '/wasm',
        modelUrl: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
        delegate: 'GPU', // falls back to CPU automatically if GPU init fails
        minPoseDetectionConfidence: 0.5,
        minPosePresenceConfidence: 0.5,
        minTrackingConfidence: 0.5,
      },
      camera: { idealWidth: 1280, idealHeight: 720 },
      // One Euro in body units (S per second). beta 2 keeps lag near 50 ms on a
      // marching knee with rest jitter about the same as beta 0.02 (which lagged
      // 100 to 140 ms); fast wrists get a higher cutoff still, so strikes lag less.
      smoothing: { minCutoff: 1.0, beta: 2.0, dCutoff: 1.0, worldUnit: 0.4, worldFollow: [13, 14, 15, 16] },
      visibility: {
        hold: 0.5,    // below this a landmark holds its last value
        framing: 0.6, // required landmarks must beat this to pass framing
      },
      calibration: {
        framingHoldMs: 1000,
        baselineMs: 3000,
        frameMargin: 0.02,   // landmarks this close to the edge count as out of frame
        driftRatio: 0.15,    // shoulder width change that suggests re-baseline
        driftHoldMs: 3000,
      },
      signals: {
        squatFullDrop: 0.5, // hip drop (in T) that reads as squat_depth 1
      },
      // Lengths in body units: S = shoulder width, T = torso length.
      // March steps: four cues per leg, after Homecoming Hero's step trigger.
      // A leg steps when `need` of its known cues pass `on`, and re-arms when
      // `need` drop below `off`; a cue whose landmarks are not visible is
      // unknown and counts neither way. Two cues read 3D world landmarks and
      // two read the 2D image, so either source can carry a step alone.
      march: {
        cues: {
          pitch: { on: 20, off: 10 },     // world: thigh angle from the calibrated vertical (degrees), above the other thigh's
          lift: { on: 0.12, off: 0.06 },  // world: knee height above standing (T), above the other knee's
          rise: { on: 0.12, off: 0.05 },  // image: knee height above its standing spot (T)
          lead: { on: 0.11, off: 0.04 },  // image: this knee's rise minus the other knee's (T)
        },
        need: 2,
        refractoryMs: 250,   // per leg, after it fires
        sameLegMinMs: 600,   // a same-leg repeat counts only after this gap (legs alternate)
        // Warm-up tuning (engine.apply_capture): each cue's on is set to tuneFrac of
        // the weakest captured round that reached seenFrac of the default on, kept
        // within [minFrac, maxFrac] of the default; off goes to half of that.
        tune: { tuneFrac: 0.4, seenFrac: 0.5, minFrac: 0.35, maxFrac: 1.5 }, // 0.6.0: 0.4 of the weakest round, room for tired knees
        // stride from knee height (0.6.0, Mark: higher knees, longer strides; a
        // tired player's lower knees still count, they just step shorter): each
        // step's peak thigh angle over refPitch, or peak knee lift over refLift,
        // averaged over the last `steps` steps, maps to a stride of min to max
        stride: { refPitch: 50, refLift: 0.3, min: 0.7, max: 1.3, steps: 4 },
        squatPauseDrop: 0.2, // squat beats march: hip drop (T) past this pauses stepping
        liftSource: 'auto',  // 'auto' uses world landmarks when the profile has them, 'image' forces 2D
        cadenceWindowMs: 3000,
      },
      run: {
        lift: 0.35,     // peak knee lift (T) of a high-knee step
        pitch: 65,      // or peak thigh angle (degrees) of a high-knee step
        // 0.8.4 (Mark 10/19: high knees intervals read as 1 or 2 s of running): tired high knees
        // run 130 to 150 steps a minute, under the old 150; knee height is what makes it a run
        cadence: 120,   // steps per minute between high-knee steps
        startSteps: 2,  // consecutive high-knee steps that start a run
        exitMs: 800,    // run ends after this long with no high-knee step (was 600)
      },
      // Torso turn steering: yaw from (shoulder width / torso length) against
      // the calibrated ratio, direction from shoulder depth and the nose.
      turn: {
        deadzone: 15,     // degrees of torso yaw that still mean straight ahead
        full: 45,         // degrees that give full turn rate
        depthMin: 0.1,    // shoulder depth difference / shoulder width that gives a direction (about 6 degrees)
        noseMin: 0.04,    // S, nose offset from the shoulder midpoint that gives a direction
        eventLevel: 0.5,  // turn level that fires turn_left / turn_right
        eventReset: 0.2,
      },
      // Lean is still measured (the lean signal), but turn steers.
      lean: {
        deadzone: 0.06,      // S
        full: 0.25,          // S, lean that reads as 1
        // S per second; faster wrists suppress turn and lean (punches never
        // steer). The spec's 2 S/s cut steering on every arm swing once the
        // torso is turned (swing then moves sideways in the image: up to 4 S/s
        // marching, 11 S/s high knees); swipes peak at 35 S/s and up.
        wristSpeedMax: 12,
        suppressHoldMs: 250, // steering stays off this long after the wrists slow down
        raisedHoldMs: 600,   // and this long after a raised (waving) hand comes down
        raisedOut: -0.05,    // shoulder widths along the shoulder line: a raised wrist counts only out at its shoulder or wider (a guard is inside)
        eventLevel: 0.5,     // steering level that fires lean_left / lean_right
        eventReset: 0.2,     // steering must return below this to fire again
      },
      point: {
        wristOut: 0.8,    // S, wrist sideways past its shoulder
        elbowMin: 150,    // degrees, near straight
        maxBelow: 0.6,    // T, wrist may sit at most this far below its shoulder
        maxWristSpeed: 1.0, // S per second; the pointing hand must be still
        holdMs: 300,
        cooldownMs: 1000,
      },
      turnAround: {
        aboveNose: 0.3, // T, both wrists this far above the nose
        holdMs: 500,
        cooldownMs: 2000,
      },
      wave: {
        minSwing: 0.15,  // S, sideways wrist travel that counts as one direction change
        minAbove: 0.25,  // T, wrist this far above its shoulder (a swipe at shoulder height is not a wave)
        reversals: 2,
        windowMs: 1000,
        cooldownMs: 2000,
      },
      effort: {
        fullCadence: 170, // cadence that reads as full effort
        fullLift: 0.6,    // knee lift (T) that reads as full effort
      },
      // Combat module (combat.js). Distances in meters unless marked S or T.
      combat: {
        guard: {
          near: 0.85,      // S, each wrist this close to the nose (2D, T scaled to S)
          below: 0.35,     // T, and no lower than this under the shoulder line
          holdMs: 150,     // both hands there this long raises the guard
          release: 1.35,   // a hand must leave near * release to count as away
          punchMs: 700,    // a hand away this briefly (a punch) keeps the guard up
        },
        stance: {
          minYaw: 10,      // degrees of torso turn that blade the stance
          handLead: 0.25,  // S, with a square torso, lead hand this far in front decides
          holdMs: 500,
        },
        strike: {
          // 0.9.0: a fast move out from a set hand toward the camera, judged where it ends
          // (StrikeDetector in combat.js). Meters and m/s scale with arm length (armScale).
          windowMs: 600,     // a move is given up (or guessed) after this long
          refractoryMs: 200, // per hand (spec: 200 ms jab/cross)
          setBelow: 0.3,     // m: a set hand's wrist no lower than this under its shoulder
          setWide: 0.4,      // m: and within this of the body's middle (not out to the side)
          setAngle: 130,     // degrees: and the elbow bent at least this much
          elbowDown: 0.12,   // m: with the elbow this far under its shoulder (a guard, not an arm swing)
          stillSpeed: 0.6,   // m/s: and still
          setMs: 70,         // for this long
          setWithinMs: 400,  // the punch starts within this long of the hand being set
          setReturn: 0.08,   // m: after a punch, back within this of where it was set (and slowing, under 2x stillSpeed) is set again
          setTravel: 0.15,   // m the fist moves from where it was set
          minSpeed: 1.6,     // m/s peak fist speed
          stopFrac: 0.35,    // a kind is judged when the fist slows under this share of its peak speed
          frontMin: 0.12,    // m: the far end is at least this far in front of its shoulder
          straightOn: 145,   // degrees: a straight ends with the elbow this straight
          fwdGain: 0.12,     // m nearer the camera than where it was set
          straightBelow: 0.15, // m: a straight lower than this under the shoulder is judged when the hand comes back
          upperRise: 0.12,   // m an uppercut rises from its lowest point
          upperShare: 0.75,  // mostly upward
          upperDip: 0.06,    // m: after dipping at least this far under where it was set, elbow bent
          upperLowest: 0.45, // m: but no lower than this under the shoulder (a hanging arm raised is not an uppercut)
          upperTo: 0.2,      // m: ending no lower than this under the shoulder
          hookTravel: 0.1,   // m a hook sweeps inward from its outermost point
          hookAngle: 150,    // degrees: hooks and uppercuts keep the elbow bent under this
          hookFront: 0.05,   // m in front of the shoulder (torso frame)
          hookHeight: 0.3,   // m: a hook stays within this of shoulder height
          fwdGuess: 0.1,     // m toward the camera: anything else thrown this far is a straight
          downDrop: 0.15,    // T hip drop: crouched, for down strikes
          downBelow: 0.3,    // m below the shoulder
          downTravel: 0.15,  // m down from where it was set
          downSpeed: 1.2,    // m/s downward
          refSpeed: 5,       // m/s of fist speed that is power 1
          overhand: true,    // a hook from the rear hand is 'overhand' (0.8.0)
        },
        // kicks and knees (0.11.0, KickDetector in combat.js), from the thigh and the knee
        kick: {
          onPitch: 30,      // degrees of thigh angle: a leg is up
          offPitch: 18,     // and back down
          downFrac: 0.6,    // judged on the way down, once under this share of its peak
          maxMs: 1200,      // a kick is up for less than this
          plantMs: 450,     // the other leg made no step this long before the kick
          afterMs: 150,     // or this long after it (judged then)
          lowPitch: 25,     // a low kick: the rear thigh this high
          sweep: 0.2,       // with the knee sweeping this far (S) toward the lead side
          teepPitch: 55,    // a teep: the lead thigh this high
          kneePitch: 60,    // a knee: the rear thigh this high, straight up
          refRate: 300,     // degrees a second of thigh rise that is power 1
          liftPerDeg: 0.007, // T of knee rise per degree, when the world landmarks are missing
        },
        // taught strikes (0.10.0, StrikeDetector in combat.js): samples of the player's own punches
        teach: {
          keep: 6,           // samples kept per punch and hand (the newest)
          points: 8,         // a sample's path resampled to this many points
          backFrac: 0.7,     // a punch is over once the fist is back to this share of its farthest reach
          earlyTol: 0.12,    // or, as the fist slows at full reach, a match this close
          earlyGap: 2.5,     // with every other punch at least this many times farther
          angleW: 0.3,       // weight of the elbow angle in a sample (arm lengths per 180 degrees)
          tol: 0.3,          // a move within this of a sample (rms, arm lengths) is that punch
          fallbackK: 1.2,    // the rules' read of a taught punch counts within this times tol
          mirrorK: 1.15,     // the other hand's samples, mirrored, count a bit farther away
          lenRatio: [0.5, 2], // a sample only matches a path between these times its length
          startSpeed: 1.2,   // m/s: while teaching, a move starts here from rest (no guard needed)
          calmMs: 300,       // from a rest within this long
          minSpeed: 1.0,     // m/s peak, for a sample to count
          minMs: 150,        // a sample ends back at rest (backM, m) after at least this long
          backM: 0.12,
          maxMs: 800,        // or after this long
          guardTol: 0.15,    // m: a hand this near its learned guard is set
          guardFrames: 10,   // still frames needed to learn a hand's guard
        },
        // arm depth from foreshortening (ArmDepth in combat.js)
        depth: {
          decay: 0.02,    // m/s the reference segment length shrinks back
          inPlane: 0.88,  // a segment at least this share of its reference reads as in the image plane
          behind: 0.05,   // m: world depth saying the segment points back this much is kept
          minLen: 0.15, maxLen: 0.42, // m, reference length bounds
          fovDeg: 75,     // camera field of view on the long side of the frame (front cameras run 65 to 80)
        },
        slip: {
          deadzone: 0.25,  // S, nose off the hip midpoint
          full: 0.55,
          eventLevel: 0.5,
          eventReset: 0.2,
        },
        // a bound out to one side and back (0.8.0): hip midpoint in S from where it was at calibration
        bound: {
          center: 0.35,  // S: starts from within this of the middle
          out: 0.9,      // S: gets this far to one side
          outMs: 600,    // within this long of leaving the middle
          back: 0.4,     // S: and comes back within this of the middle
          backMs: 900,   // within this long of its furthest point
        },
        level: {
          squat: 0.3,      // T level drop that is a squat (spec 0.35; 0.4.2 eased for a fighting crouch)
          reset: 0.15,     // T: re-arms above this (spec)
          speedMs: 400,    // squat speed measured over this long
          rise: 0.2,       // T the level comes back up for a drive up
          driveMs: 400,    // within this long (spec: 0.35 T in 400 ms), however long the squat was held; a slow stand is not a drive
          holdFrac: 0.8,   // a squat counts as held while the level stays past this share of squat
          jump: 0.2,       // T above standing that is a jump (a hop off the floor); 0.8.4: was 0.12, which a fast drive up onto the toes reached (Mark: takedowns with no jump)
        },
        fight: {
          jumpWaitMs: 300,   // after a drive up, how long a jump can still add to the shot
          // 0.7.0 (Mark: the squat is the level change, the jump is the takedown): with
          // requireJump only a jump off the drive up shoots; a drive up with no jump inside
          // requireJumpWaitMs is just a 'level_change'
          requireJump: false,
          requireJumpWaitMs: 500,
          refRise: 2.0,      // T/s of drive up speed that is shot power 1 (a 0.4 s rise out of a 0.6 T squat is about 1.8)
          jumpBonus: 0.5,    // shot power a jump off the drive adds
          gnpMs: [2000, 5000], // the ground and pound burst, weakest to strongest takedown
          escapeMs: 3000,    // high knees this long escapes the fight (spec)
        },
      },
      // Speeds are in world units per second; games scale them to their world.
      locomotion: {
        walkSpeed: 1.4,
        runSpeed: 3.5,
        walkCadence: 70,       // below this cadence the player stops
        refCadence: 110,       // cadence that gives exactly walkSpeed
        walkScale: [0.8, 1.2], // walk speed range as a multiple of walkSpeed
        strideMax: 1.3,        // high knees on a run can lengthen the stride this far
        rampMs: 300,           // speed reaches its target over this long
        stopMs: 400,           // coast to a stop over this long
        stopAfterMs: 600,      // no step for this long (or 1.5 step intervals, if longer) stops you
        stopIntervals: 1.5,
        maxTurnRate: 90,       // degrees per second at full turn (free movement)
      },
      demo: {
        doubleTapMs: 350,
        runHoldMs: 250,
        runCadence: 170,
        cadenceWindowMs: 3000,
        squatHoldMs: 1500, // the demo squat button holds a squat this long (touch cannot hold a crouch)
      },
      // a second camera at the side (0.12.0, side.js): a sample is fresh for maxAgeMs; without
      // a clock sync it is taken to be leadMs older than its arrival (the link's delay); landmarks below
      // minVis are not used; the arms are swapped to match the main camera's when that fits
      // swapMargin (T) better on average
      // alignMs: the main frame used with a side frame is at most this far from it in time
      // swapFrames: frames of wrist height evidence averaged; flipMargin (T): a jump that big
      // toward the other wrist's place is the phone's labels flipping
      // peer: PeerJS options for the signaling server (null: PeerJS's free public one)
      side: { maxAgeMs: 180, leadMs: 40, minVis: 0.5, swapMargin: 0.12, swapFrames: 12, flipMargin: 0.3, alignMs: 25, peer: null },
      recorder: { maxMs: 30000, decimals: 4 },
      overlay: { eventLogSize: 10 },
    };
  };

  // Camera presets. mirrorDisplay only flips what the player sees; the math
  // uses anatomical sides, so it never depends on mirroring.
  RE.presets = Object.freeze({
    living_room: { id: 'living_room', label: 'Living room', facingMode: 'user', mirrorDisplay: true, distanceFt: 4 },
    garage: { id: 'garage', label: 'Garage', facingMode: 'user', mirrorDisplay: true, distanceFt: 6 },
    custom: { id: 'custom', label: 'Custom', facingMode: 'user', mirrorDisplay: true, distanceFt: null },
    // Back camera, screen mirrored to a TV. Prefers the ultra-wide lens (or the
    // widest zoom), falls back to the main back camera, then the front camera.
    tv: { id: 'tv', label: 'TV, back camera', facingMode: 'environment', wideLens: true, mirrorDisplay: true, distanceFt: 6 },
  });

  // Deep merge for config overrides (plain objects only).
  RE.mergeConfig = function merge(base, overrides) {
    if (!overrides) return base;
    const out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
    for (const key of Object.keys(overrides)) {
      const b = base ? base[key] : undefined;
      const o = overrides[key];
      out[key] = b && o && typeof b === 'object' && typeof o === 'object' && !Array.isArray(o)
        ? merge(b, o)
        : o;
    }
    return out;
  };
})(globalThis);

// ---- engine/one-euro.js ----
// One Euro filter (Casiez et al. 2012) plus a per-landmark smoother with
// visibility gating. Low visibility holds the last good value and flags it.
(function (g) {
  'use strict';
  const RE = g.RepEngine;

  function alpha(cutoff, dt) {
    const tau = 1 / (2 * Math.PI * cutoff);
    return 1 / (1 + tau / dt);

      const ratio = ctx.cal.torsoLength / ctx.cal.shoulderWidth; // T in S
      const dist = (w) => Math.hypot(w.x - b.nose.x, (w.y - b.nose.y) * ratio);
      const near = (w, lim) => dist(w) <= lim && w.y >= b.sMid.y - this.c.below;
      const ok = (i) => { const p = ctx.points[i]; return p && !p.held && p.v >= ctx.holdVis; };

      if (nl) this.lastNear.left = t;

        const l = keep(b.lw, L.L_WRIST) || t - this.lastNear.left < this.c.punchMs;
        const r = keep(b.rw, L.R_WRIST) || t - this.lastNear.right < this.c.punchMs;
        if (ctx.upperLow || !(l && r)) { this.up = false; this.since = null; }

    }
  }

  // Stance: which shoulder leads (nearer the camera). Torso yaw from the turn
  // detector gives it; with a square torso, a hand clearly in front decides.
  // Held stanceMs before it changes; fires 'stance' on a change.
  class StanceDetector {
    constructor(cfg) { this.c = cfg.combat.stance; this.stance = 'square'; this.cand = 'square'; this.since = 0; }

  // Strikes, per hand (0.9.0, Mark 10/20: the warm-up missed hooks and uppercuts, and waving
  // the arms back and forth threw hooks; "just guess from the movement"). A punch is a fast move
  // out from a set hand toward the camera (where the opponent is), judged where it ends:
  //   set       the hand was up in front (wrist no lower than setBelow under its shoulder,
  //             within setWide of the body's middle, elbow bent under setAngle) and still
  //             (under stillSpeed) for setMs, and the move began within setWithinMs of that.
  //             Waving or flailing never holds still, so it never starts a punch.
  //   the move  fist speed past minSpeed and setTravel from where it was set; it is judged at
  //             its far end (the fist stops getting farther, or slows under stopSpeed), which
  //             has to be frontMin in front of its shoulder.
  //   straight  the elbow ends straight (straightOn) with the fist fwdGain nearer the camera:

  //   hook      the fist swept inward hookTravel (torso frame) from its outermost point, the
  //             elbow still bent (hookAngle); from the rear hand it is the overhand (0.8.0)
  //   guess     anything else that went toward the camera (fwdGuess) is a straight
  //   down      from a crouch, the fist driving down (downBelow, downSpeed)
  // Power is peak fist speed over refSpeed, clamped 0.5 to 1.5 (spec).
  // Taught strikes (0.10.0, Mark 10/21: "the coach teaches you how to throw a strike, the system
  // captures it, and that's how it reads it"). In the gym the game asks for each punch; while
  // teaching (engine.teach_strike), every move the asked-for hand makes out from rest is kept as
  // that player's sample of that punch, whatever the rules make of it, and while the guard is held
  // (engine.teach_guard) the engine learns where that player's hands rest. From then on a hand
  // near its learned guard counts as set, and a move is read by the nearest of the player's own
  // samples (the shape of the fist's path from where it was set to its far end, in arm lengths,
  // with the elbow angle), the other hand's samples mirrored when a hand has none. The rules
  // below still read any punch that was never taught.
  const ROLE = { jab: 'straight', cross: 'straight', hook: 'hook', overhand: 'hook', uppercut: 'uppercut' };
  // where a punch is over: the fist has come back to backFrac of its farthest distance from where
  // it was set (its index in path), or -1 while it is still out
  function backAt(path, backFrac, minFar = 0) {
    const s0 = path[0];
    let far = 0;
    for (let i = 1; i < path.length; i++) {

    }
    return -1;
  }
  // the fist's path from where it was set until it is on its way back, resampled to n points by
  // arc length, in arm lengths (L, m), each point [dx, dy, dz, elbow angle / 180 * angleW]
  // (backFrac 0: only out to its farthest point, for an early read)
  function strikeShape(path, L, n, angleW, backFrac) {
    const s0 = path[0];
    let seg;
    if (backFrac > 0) { const bi = backAt(path, backFrac, 0.05); seg = bi > 0 ? path.slice(0, bi + 1) : path; }
    else {
      let fi = 0, fd = 0;
      path.forEach((x, i) => { const d = Math.hypot(x.x - s0.x, x.y - s0.y, x.z - s0.z); if (d > fd) { fd = d; fi = i; } });
      seg = path.slice(0, fi + 1);
    }
    let far = 0;
    for (const x of seg) far = Math.max(far, Math.hypot(x.x - s0.x, x.y - s0.y, x.z - s0.z));
    if (seg.length < 2) return null;
    const cum = [0];
    for (let i = 1; i < seg.length; i++) cum.push(cum[i - 1] + Math.hypot(seg[i].x - seg[i - 1].x, seg[i].y - seg[i - 1].y, seg[i].z - seg[i - 1].z));

      while (j < seg.length - 1 && cum[j] < at) j++;
      const a = seg[j - 1], b = seg[j], u = cum[j] > cum[j - 1] ? RE.clamp((at - cum[j - 1]) / (cum[j] - cum[j - 1]), 0, 1) : 1;
      const lp = (p, q) => p + (q - p) * u;
      pts.push([(lp(a.x, b.x) - s0.x) / L, (lp(a.y, b.y) - s0.y) / L, (lp(a.z, b.z) - s0.z) / L, (lp(a.angle, b.angle) / 180) * angleW]);

  // root mean square distance between two shapes; mirror flips the other hand's sideways axis
  function shapeDist(a, b, mirror) {

    for (let i = 0; i < a.pts.length; i++) {
      const p = a.pts[i], q = b.pts[i];

  // The player's taught punches. With a side camera on (0.12.0) the set taught with it, since its
  // depth is truer and the paths differ; without one the main camera's set. Either falls back to
  // the other until it has samples of its own.
  function libOf(ctx) {
    const c = ctx.cal;
    if (!c) return null;
    return (ctx.sideOn ? c.strikesSide || c.strikes : c.strikes || c.strikesSide) || null;
  }
  function libFor(ctx) { const k = ctx.sideOn ? 'strikesSide' : 'strikes'; return (ctx.cal[k] = ctx.cal[k] || {}); }
  class StrikeDetector {
    constructor(cfg) {
      this.c = cfg.combat.strike;
      this.T = cfg.combat.teach;
      this.isStrike = true;
      const hand = () => ({ hist: [], last: -Infinity, setAt: -Infinity, stillSince: null, prev: null, live: false, calm: null, calmAt: -Infinity });

        for (const [tp, mirror, k] of cands) {

    }
    taught(ctx, role) {

    // teaching: any move out from rest by the asked-for hand is a sample of the asked-for punch
    teachTick(ctx, hand, h, s, c, out) {
      const T = this.T, t = ctx.t;

      }
      const back = t - h.from > T.minMs && s.v < c.stillSpeed && Math.hypot(s.x - h.set.x, s.y - h.set.y, s.z - h.set.z) <= T.backM;
      if (!back && t - h.from <= T.maxMs) return;

      const peakV = Math.max(0, ...path.map((x) => x.v));
      const shape = peakV >= T.minSpeed ? strikeShape(path, this.armL(out), T.points, T.angleW, T.backFrac) : null;
      if (!shape || shape.far * this.armL(out) < c.setTravel) return;

      const lib = libFor(ctx);
      const list = ((lib[hand] = lib[hand] || {})[role] = lib[hand][role] || []);
      list.push(Object.assign(shape, { speed: peakV, out: strikeShape(path, this.armL(out), T.points, T.angleW, 0) }));
      while (list.length > T.keep) list.shift();

      out.events.push(['strike_taught', { hand, role, n: list.length, speed: peakV }]);
    }
    update(ctx, out) {
      const t = ctx.t;
      const arms = out.arms;

      const c = scaled(this.c, out.armScale || 1);
      for (const hand of ['left', 'right']) {
        const h = this.hands[hand];
        const a = arms[hand];
        const p = a.wrist;
        const q = arms.torso[hand];
        // camera frame (x from the body's middle, y and z from its own shoulder) and torso frame (tx, tz)
        const s = { t, angle: a.angle, x: p.x * sw, y: (p.y - a.shoulder.y) * sw, z: (p.z - a.shoulder.z) * sw, tx: q.wrist.x * sw, tz: (q.wrist.z - q.shoulder.z) * sw, ey: (a.elbow.y - a.shoulder.y) * sw };
        s.v = h.prev && t > h.prev.t ? Math.hypot(s.x - h.prev.x, s.y - h.prev.y, s.z - h.prev.z) / ((t - h.prev.t) / 1000) : 0;
        h.prev = s;
        h.hist.push(s);
        while (h.hist.length && t - h.hist[0].t > c.windowMs) h.hist.shift();
        if (ctx.upperLow) { h.stillSince = null; h.live = false; continue; }
        if (s.v < c.stillSpeed) { h.calm = s; h.calmAt = t; }
        // teaching (0.10.0): the guard's resting place, or this hand's sample of a punch
        if (ctx.teach && ctx.teach.guard && s.v < c.stillSpeed) {
          const g = (this.guardAcc[hand] = this.guardAcc[hand] || { x: 0, y: 0, z: 0, n: 0 });
          g.x += s.x; g.y += s.y; g.z += s.z; g.n++;
        }
        if (ctx.teach && ctx.teach.role && ctx.teach.hand === hand) { this.teachTick(ctx, hand, h, s, c, out); continue; }
        // a set hand: a guard (fist up in front, elbow down and bent) held still, or the player's
        // own guard (learned in the gym, 0.10.0); after a punch, coming back to where it was set
        // is enough (combos: a double jab rests about 50 ms)
        const gp = ctx.cal && ctx.cal.guardPos && ctx.cal.guardPos[hand];
        const set = (s.y >= -c.setBelow && Math.abs(s.x) <= c.setWide && s.angle <= c.setAngle && s.ey <= -c.elbowDown) || (!!gp && Math.hypot(s.x - gp.x, s.y - gp.y, s.z - gp.z) <= this.T.guardTol);

        if (set && s.v < c.stillSpeed) {

          if (t - h.stillSince >= c.setMs) {

            h.setAt = t; h.set = s; h.live = false;

          continue;

        if (t - h.last < c.refractoryMs) continue;
        if (!h.live) {

          if (t - h.setAt > c.setWithinMs) continue;
          if (Math.hypot(s.x - h.set.x, s.y - h.set.y, s.z - h.set.z) < c.setTravel) continue;

        }

        if (s.y < -c.upperLowest) { h.live = false; h.setAt = -Infinity; continue; }
        // judge each kind as its shape completes and the fist slows down; give up after windowMs
        if (t - h.from > c.windowMs) { this.finish(ctx, hand, h, out, c, true); continue; }
        const path = h.hist.filter((x) => x.t >= h.from);
        const peakV = Math.max(...path.map((x) => x.v));

        // the rules alone judge each kind as its shape completes and the fist slows
        if (libOf(ctx)) {
          if (backAt([h.set, ...path], this.T.backFrac, c.setTravel) > 0) this.finish(ctx, hand, h, out, c, false);

        }

    }
    // judge the move so far; guess: also call anything else thrown at the camera a straight
    finish(ctx, hand, h, out, c, guess, early) {
      const path = h.hist.filter((x) => x.t >= h.from);
      const peakV = Math.max(0, ...path.map((x) => x.v));
      let type = peakV >= c.minSpeed ? this.classify(ctx, hand, [h.set, ...path], out, c, guess) : null;
      // the player's own samples come first; the rules read what was never taught, and a taught
      // punch the rules see still counts when it is not far from the player's samples
      const T = this.T, m = peakV >= Math.min(c.minSpeed, T.minSpeed) ? this.match(ctx, hand, [h.set, ...path], out, early) : null;

      if (early) {

      h.setAt = -Infinity;
      // 0.8.0 (Mark): a hook from the rear hand is the overhand
      if (type === 'hook' && this.c.overhand && hand === (out.stance === 'southpaw' ? 'left' : 'right')) type = 'overhand';
      out.events.push(['strike', { hand, type, power: RE.clamp(peakV / this.c.refSpeed, 0.5, 1.5), speed: peakV }]);
    }

    classify(ctx, hand, path, out, c, guess) {
      const s0 = path[0], end = path[path.length - 1];
      const lowStance = (ctx.sig.levelDrop != null ? ctx.sig.levelDrop : ctx.sig.hipDrop) >= c.downDrop;
      const maxZ = Math.max(...path.map((x) => x.z));
      if (lowStance && end.y <= -c.downBelow && s0.y - end.y >= c.downTravel) return 'down';

      if (maxZ < c.frontMin) return null;
      const lead = out.stance === 'southpaw' ? 'right' : 'left';

      let bestRise = 0, upEnd = null;
      for (let i = 1; i < path.length; i++) {

        const dip = path[0].y - low.y >= c.upperDip && low.y >= -c.upperLowest && low.angle <= c.straightOn + 10; // a bent-arm dip, not a hanging arm
        if (rise > bestRise && rise >= c.upperShare * across && x.y >= -c.upperTo && dip) { bestRise = rise; upEnd = x; }

  const METERS = ['setBelow', 'setWide', 'setReturn', 'elbowDown', 'stillSpeed', 'setTravel', 'minSpeed', 'frontMin', 'fwdGain', 'straightBelow', 'fwdGuess', 'upperRise', 'upperDip', 'upperLowest', 'upperTo', 'hookTravel', 'hookHeight', 'hookFront', 'downBelow', 'downTravel', 'downSpeed'];

    if (!s || s.base !== c) {
      s = Object.assign({}, c, { base: c });
      for (const m of METERS) if (m !== 'reach' && typeof c[m] === 'number') s[m] = c[m] * (key / 100);

  // Slip: head off the center line, nose against the hip midpoint (2D body

  class SlipDetector {

  // Level changes, from sig.levelDrop (the hips, or the shoulders when the

        version: 1,
        meta: Object.assign({}, this.meta, {
          orientation: first ? RE.orientationOf(first.w, first.h) : null,
          durationMs: this.frames.length ? this.frames[this.frames.length - 1].t : 0,
          frameCount: this.frames.length,

      on: (name, fn) => emitter.on(name, fn),

      signals() {
        if (st.source === 'demo' && st.demoInput) {
          const now = RE.now();
          const s = st.demoInput.signals(now);
          st.loco.update(now, s, st.mode);
          s.speed = st.loco.speed;
          st.snapshot = s;
          combatTick(now);
        }
        return Object.assign({}, st.snapshot);
      },

      // Locomotion state: {state: idle | walk | run, speed, target_speed,
      // facing (degrees), lateral (-1..1, rails only), queued (rails: the
      // point waiting for the next intersection, 'left' | 'right' | null)}.
      // Safe to call from the set_movement hooks: inside an update it returns
      // the current snapshot without updating again.
      locomotion() {
        if (st.source === 'demo' && !st.loco.updating) api.signals();
        return st.loco.snapshot();
      },
      // Point the player at a heading (degrees), e.g. at the start of a walk.
      set_facing(deg) { st.loco.setFacing(deg); },

      // Warm-up tuning, after Homecoming Hero. While capturing, the engine
      // records each step cue's peak per leg and per round. apply_capture()
      // sets each cue's on value to half the player's weakest round that still
      // showed the move (bounded around the default), saves it with the
      // profile, and returns {seen: {step}, cues}. Only 'step' for now.
      capture_start(move = 'step', round = 0) {
        if (move !== 'step') throw new Error('unknown capture move ' + move);
        st.capture.move = move;
        st.capture.round = round;
      },
      capture_stop() { st.capture.move = null; },
      capture_reset() { st.capture = { move: null, round: 0, peaks: { left: {}, right: {} } }; },
      // {step: true} once any step cue has shown the move in some round
      moves_seen() {
        const step = ['left', 'right'].some((leg) => Object.keys(cfg.march.cues).some((id) => goodRounds(leg, id).length > 0));
        return { step };
      },
      apply_capture() {
        const t = cfg.march.tune;
        const cues = { left: {}, right: {} };
        let seen = false;
        for (const leg of ['left', 'right']) {
          for (const id of Object.keys(cfg.march.cues)) {
            const def = cfg.march.cues[id];
            const good = goodRounds(leg, id);
            if (!good.length) continue; // not seen: the default stays
            seen = true;
            const pk = Math.min(...good);
            const on = RE.clamp(t.tuneFrac * pk, t.minFrac * def.on, t.maxFrac * def.on);
            cues[leg][id] = { on, off: Math.min(0.25 * pk, 0.5 * on) };
          }
        }
        if (seen && st.cal) {
          st.cal.cues = cues;
          RE.profiles.save(st.cal);
        }
        return { seen: { step: seen }, cues };
      },
      // Taught strikes (0.10.0): the gym teaches each punch and the engine reads that player's
      // punches from their own samples (see StrikeDetector in combat.js).
      //   engine.teach_guard()               while the guard is held: learn where the hands rest
      //   engine.teach_strike(role, hand)    role 'straight' | 'hook' | 'uppercut'; every move
      //                                      that hand makes out from rest is a sample of it
      //                                      ('strike_taught' { hand, role, n, speed })
      //   engine.teach_stop()                saves what was taught with the profile
      //   engine.strike_samples()            { left: { straight: n, ... }, right: {...}, guard, side }
      //                                      (with a side camera on, the set taught with it)
      //   engine.forget_strikes()            back to the rules alone
      teach_guard() { st.teach = { guard: true }; const d = strikeDet(); if (d) d.guardAcc = { left: null, right: null }; },
      teach_strike(role, hand) {
        if (!['straight', 'hook', 'uppercut'].includes(role) || !['left', 'right'].includes(hand)) throw new Error('teach_strike(role, hand): ' + role + ', ' + hand);
        st.teach = { role, hand };
      },
      teach_stop() {
        const was = st.teach;
        st.teach = null;
        if (!st.cal || !was) return;
        if (was.guard) {
          const d = strikeDet();
          const pos = {};
          for (const hand of ['left', 'right']) { const g = d && d.guardAcc[hand]; if (g && g.n >= cfg.combat.teach.guardFrames) pos[hand] = { x: g.x / g.n, y: g.y / g.n, z: g.z / g.n }; }
          if (Object.keys(pos).length) st.cal.guardPos = Object.assign({}, st.cal.guardPos, pos);
        }
        RE.profiles.save(st.cal);
      },
      strike_samples() {
        // the set in use: taught with the side camera when one is on (0.12.0)
        const side = st.side.connected(st.raw ? st.raw.t : RE.now());
        const lib = (st.cal && (side ? st.cal.strikesSide : st.cal.strikes)) || {}, out = { guard: !!(st.cal && st.cal.guardPos), side };
        for (const hand of ['left', 'right']) { out[hand] = {}; for (const role of ['straight', 'hook', 'uppercut']) out[hand][role] = (lib[hand] && lib[hand][role] || []).length; }
        return out;
      },
      forget_strikes() {
        if (!st.cal) return;
        delete st.cal.strikes; delete st.cal.strikesSide; delete st.cal.guardPos;
        RE.profiles.save(st.cal);
      },
      // Back to the default step thresholds for this profile.
      clear_tuning() {
        if (!st.cal) return;
        delete st.cal.cues;
        RE.profiles.save(st.cal);
      },
      // The side camera (0.12.0, side.js; side-link.js connects one):
      //   engine.side_feed(frame[, t])   a frame from RE.sidePack, arriving now (or at t, tests)
      //   engine.side_sync(offset)       the phone's clock to this one (main = side + offset, ms)
      //   engine.side_status()           { connected, fps, tilt (degrees from a true profile), synced,
      //                                    using (fresh enough to read the arms) }
      side_feed(frame, t) {
        const at = t == null ? RE.now() : t;
        st.side.push(frame, at, st.cal);
        st.sideOut = frame;
      },
      // the phone's clock to this one: main = side + offset (ms), measured by the link
      side_sync(offset) { st.side.sync(offset); },
      side_status() {
        const t = st.raw ? st.raw.t : RE.now(), s = st.side.samples[st.side.samples.length - 1];
        return { connected: st.side.connected(t), fps: st.side.fps(t), tilt: s ? Math.round((s.tilt * 180) / Math.PI) : null, using: !!(st.det && st.det.sideUsed), synced: st.side.offset != null };
      },
      // Which camera is running: {facing, lens, fallback, label} or null.
      camera() { return st.sourceObj && st.sourceObj.info ? Object.assign({}, st.sourceObj.info) : null; },
      // Movement model, see locomotion.js: {rails, at_intersection(),
      // branch_bearing(side), target_bearing()}.
      set_movement(model) { st.loco.setModel(model || {}); },

      set_mode(mode) {
        if (!MODES.includes(mode)) throw new Error('unknown mode ' + mode);
        if (mode === st.mode) return;
        st.mode = mode;
        if (mode !== 'combat') st.combatTarget = null;
        emitter.emit('mode', { mode });
      },
      // target: {bearing() (degrees, the player faces it), shooting(), open()}, all optional
      enter_combat(target) {
        st.combatTarget = target || null;
        st.combat.enter(target);
        st.loco.setCombatBearing(target && target.bearing ? () => target.bearing() : null);
        api.set_mode('combat');
      },
      exit_combat() { st.combat.enter(null); st.loco.setCombatBearing(null); api.set_mode('explore'); },
      // Fight state: {phase: standing | shot | top, stance, guard}
      combat() {
        const s = api.signals();
        return Object.assign(st.combat.snapshot(), { stance: s.stance, guard: s.guard_up, mode: st.mode });
      },
      // Arm pose to mirror: {left, right}, each {shoulder, elbow, wrist} in
      // shoulder widths from the shoulder midpoint (x = player's right, y = up,
      // z = toward the camera), plus angle, extension (0..1) and reach (-1..1).
      // null when the arms are not tracked.
      arms() {
        if (st.source === 'demo' && st.demoInput) return st.demoInput.arms(RE.now());
        const a = st.det && st.det.arms;
        return a ? { left: a.left, right: a.right } : null;
      },
      mode: () => st.mode,

      start_recording(meta) { st.recorder.start(Object.assign({ preset: st.presetId }, meta)); },
      stop_recording() { return st.recorder.stop(); },
      is_recording: () => st.recorder.active,
      recording_ms: () => st.recorder.elapsedMs,

      // Session telemetry. activeMs is time spent moving (walk or run);
      // strike totals and the work/rest split arrive with the combat module.
      session_summary() {
        const end = st.raw && st.source !== 'demo' ? st.raw.t : RE.now();
        return Object.assign({
          startedAt: st.session.startedAt,
          durationMs: st.session.startedAt === null ? 0 : Math.max(0, end - st.session.startedAt),
          frames: st.session.frames,
          events: Object.assign({}, st.session.counts),
        }, st.loco.summary());
      },

      // Debug view for the overlay and tests. Games should not depend on it.
      debug() {
        return {
          source: st.source,
          mode: st.mode,
          preset: st.presetId,
          mirror: preset().mirrorDisplay,
          fps: st.sourceObj && st.sourceObj.fps ? st.sourceObj.fps : 0,
          delegate: st.sourceObj && st.sourceObj.delegate ? st.sourceObj.delegate : null,
          frame: st.frame,
          raw: st.raw,
          cal: st.cal,
          calibration: st.calibrator ? st.calStatus : null,
          signals: api.signals(),
          rawSignals: st.sig,
          detectors: st.det,
          demo: st.demoInput,
          locomotion: st.loco.snapshot(),
          combat: st.mode === 'combat' ? st.combat.snapshot() : null,
          capture: st.capture,
        };
      },

      // Feed one raw frame directly (tests and custom sources).
      _ingest: ingest,
    };
    return api;
  };

  function emptySnapshot() {
    return { cadence_spm: 0, effort: 0, speed: 0, turn: 0, lean: 0, squat_depth: 0, guard_up: false, guard_left: false, guard_right: false, stance: 'square', slip: 0, level_low: false, side_cam: false, stride: 1, knee_lift: 0, confidence: 0 };
  }
})(globalThis);
</script>
</head>
<body>
<header>
  <h1>rep-engine lab</h1>
  <div class="row">
    <select id="preset" aria-label="Camera preset"></select>
    <button id="camera" class="primary">Start camera</button>
    <button id="demoBtn">Demo mode</button>
    <button id="calibrate" disabled>Calibrate</button>
    <button id="skipMove" hidden>Skip prompt</button>
    <button id="record" disabled>Record 30 s</button>
    <label class="file">Replay clip<input id="clipFile" type="file" accept=".json,application/json"></label>
    <button id="clearProfile">Clear profile</button>
    <button id="stop">Stop</button>
  </div>
  <div id="status">Prop the phone up, then start the camera. Three-finger tap toggles the overlay.</div>
</header>
<div id="stage">
  <video id="video" playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="demo"></div>
</div>
<div id="stats" hidden></div>

<script>
(function () {
  'use strict';
  const RE = window.RepEngine;
  const $ = (id) => document.getElementById(id);
  const video = $('video'), canvas = $('overlay'), status = $('status');
  const presetSel = $('preset');

  for (const p of Object.values(RE.presets)) {
    const o = document.createElement('option');
    o.value = p.id;
    o.textContent = p.label + (p.distanceFt ? ` (${p.distanceFt} ft)` : '');
    presetSel.appendChild(o);
  }

  const engine = RE.create({ video, preset: presetSel.value });
  new RE.DebugOverlay(canvas, engine);

  const say = (msg) => { status.textContent = msg; };
  const setLive = (live) => { $('calibrate').disabled = !live; $('record').disabled = !live; };

  engine.on('status', (e) => say(e.message));
  engine.on('calibrated', (e) => {
    const c = e.cal;
    $('skipMove').hidden = true;
    const extra = e.skippedTests ? ` ${e.skippedTests} move test prompts (squat, jab-cross) arrive with the combat module.` : '';
    say(`${e.fromProfile ? 'Loaded saved' : 'Saved'} ${c.orientation} profile: S ${c.shoulderWidth.toFixed(0)} px, T ${c.torsoLength.toFixed(0)} px.${extra}`);
  });
  engine.on('recalibrate_needed', (e) => say(`No ${e.orientation} profile yet. Tap Calibrate.`));
  engine.on('recalibrate_suggested', () => say('You moved closer or farther than your baseline. Tap Calibrate to re-baseline.'));
  engine.on('recording_done', (e) => { finishRecording(e.clip); });

  $('camera').addEventListener('click', async () => {
    video.classList.toggle('mirror', !!RE.presets[presetSel.value].mirrorDisplay);
    try {
      await engine.start(presetSel.value);
      setLive(true);
      say(engine.is_calibrated() ? 'Tracking with your saved profile.' : 'Tracking. Tap Calibrate.');
    } catch (err) {
      say('Camera failed: ' + err.message);
    }
  });

  $('demoBtn').addEventListener('click', () => {
    engine.enable_demo($('demo'));
    setLive(false);
    say('Demo mode: left zone marches, right zone turns, buttons fire events.');
  });

  $('calibrate').addEventListener('click', () => {
    say('Calibrating: step back until shoulders, hips and knees are in frame.');
    engine.calibrate(presetSel.value).catch(() => {});
  });
  // During the move test, show which prompt is waiting and allow skipping it.
  engine.on('calibration', (c) => {
    const testing = c.state === 'move_test';
    $('skipMove').hidden = !testing;
    if (testing) say(`Move test: ${c.prompt}. Tap Skip prompt if it never registers.`);
  });
  $('skipMove').addEventListener('click', () => engine.skip_move_test());

  let recording = false;
  const recBtn = $('record');
  recBtn.addEventListener('click', () => {
    if (!recording) {
      engine.start_recording({ preset: presetSel.value, userAgent: navigator.userAgent });
      recording = true;
      recBtn.textContent = 'Stop and save';
      recBtn.classList.add('rec');
      say('Recording up to 30 s.');
    } else {
      finishRecording(engine.stop_recording());
    }
  });
  function finishRecording(clip) {
    recording = false;
    recBtn.textContent = 'Record 30 s';
    recBtn.classList.remove('rec');
    RE.downloadClip(clip);
    say(`Saved ${clip.meta.frameCount} frames (${(clip.meta.durationMs / 1000).toFixed(1)} s, ${clip.meta.orientation}).`);
  }

  // Replay a clip, calibrate from its first seconds, and summarize signals so
  // a portrait and a landscape recording of the same movement can be compared.
  const summaries = [];
  $('clipFile').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    let clip;
    try { clip = RE.validateClip(JSON.parse(await file.text())); } catch (err) { say('Could not read clip: ' + err.message); return; }
    video.classList.remove('mirror');
    setLive(false);
    const acc = { name: file.name, orientation: clip.meta.orientation, frames: 0, lean: [Infinity, -Infinity], squat: 0, kneeL: 0, kneeR: 0, cadence: 0, events: {} };
    const offEvents = engine.on('*', (name, payload) => {
      if (!COUNTED.includes(name)) return;
      const key = name === 'point' || name === 'slip' ? `${name} ${payload.side}` : name === 'strike' ? `strike ${payload.type}` : name === 'stance' ? `stance ${payload.stance}` : name;
      acc.events[key] = (acc.events[key] || 0) + 1;
    });
    const off = engine.on('frame', (snap) => {
      acc.cadence = Math.max(acc.cadence, snap.cadence_spm);
      const s = engine.debug().rawSignals;
      if (!s || s.lean == null) return;
      acc.frames++;
      acc.lean = [Math.min(acc.lean[0], s.lean), Math.max(acc.lean[1], s.lean)];
      acc.squat = Math.max(acc.squat, s.squatDepth);
      acc.kneeL = Math.max(acc.kneeL, s.kneeLiftL);
      acc.kneeR = Math.max(acc.kneeR, s.kneeLiftR);
    });
    say(`Replaying ${file.name}. Stand still for the first 4 s of a clip so it can calibrate.`);
    engine.calibrate(presetSel.value, { moveTest: false }).catch(() => {});
    await engine.start_replay(clip, { realtime: true });
    off();
    offEvents();
    engine.cancel_calibration();
    summaries.unshift(acc);
    summaries.length = Math.min(summaries.length, 2);
    renderStats();
    say(acc.frames ? `Replay done: ${acc.frames} calibrated frames.` : 'Replay done, but the clip never calibrated. Start clips standing still.');
  });

  const COUNTED = ['step', 'run_start', 'run_end', 'turn_left', 'turn_right', 'lean_left', 'lean_right', 'point', 'turn_around', 'wave', 'strike', 'slip', 'stance', 'squat', 'drive_up', 'jump'];
  const EVENT_ROWS = ['step', 'run_start', 'run_end', 'turn_left', 'turn_right', 'lean_left', 'lean_right', 'point left', 'point right', 'turn_around', 'wave',
    'strike jab', 'strike cross', 'strike hook', 'strike uppercut', 'strike down', 'slip left', 'slip right', 'stance orthodox', 'stance southpaw', 'squat', 'drive_up', 'jump'];

  function renderStats() {
    const el = $('stats');
    el.hidden = false;
    const f = (v) => (isFinite(v) ? v.toFixed(2) : '--');
    const rows = [
      ['orientation', (s) => s.orientation || '--'],
      ['calibrated frames', (s) => s.frames],
      ['lean min', (s) => f(s.lean[0])],
      ['lean max', (s) => f(s.lean[1])],
      ['squat depth max', (s) => f(s.squat)],
      ['knee lift L max', (s) => f(s.kneeL)],
      ['knee lift R max', (s) => f(s.kneeR)],
      ['cadence max', (s) => s.cadence],
      ...EVENT_ROWS.map((key) => [key, (s) => s.events[key] || 0]),
    ];
    const head = '<tr><th>Signal</th>' + summaries.map((s) => `<th>${escapeHtml(s.name)}</th>`).join('') + '</tr>';
    const body = rows.map(([label, get]) => `<tr><td>${label}</td>` + summaries.map((s) => `<td>${get(s)}</td>`).join('') + '</tr>').join('');
    el.innerHTML = `<table>${head}${body}</table>`;
  }
  const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  $('clearProfile').addEventListener('click', () => { engine.clear_profile(); say('Profile cleared for this preset and orientation.'); });
  $('stop').addEventListener('click', () => { engine.stop(); setLive(false); say('Stopped.'); });
})();
</script>
</body>
</html>
