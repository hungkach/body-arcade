<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>rep-engine lab</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --line: #2a2f3a; --text: #e9ecf1; --muted: #9aa3b2;
    --accent: #3fd18a; --warn: #ffb347; --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, sans-serif; }
  body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { font-size: 16px; margin: 0 0 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  button, select, label.file { font: inherit; font-weight: 600; color: var(--text); background: #232834; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-height: 40px; cursor: pointer; }
  button.primary { background: var(--accent); color: #062014; border-color: transparent; }
  button.rec { background: var(--danger); color: #fff; border-color: transparent; }
  button:disabled { opacity: .45; cursor: default; }
  label.file input { display: none; }
  #status { margin-top: 8px; color: var(--muted); font-size: 13px; min-height: 18px; }
  #stage { position: relative; flex: 1; min-height: 320px; background: #000; overflow: hidden; }
  #stage video, #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #stage video { object-fit: contain; }
  #stage video.mirror { transform: scaleX(-1); }
  #demo { position: absolute; inset: 0; }
  #stats { padding: 10px 12px; border-top: 1px solid var(--line); background: var(--panel); font-size: 13px; color: var(--muted); }
  #stats table { border-collapse: collapse; width: 100%; color: var(--text); }
  #stats th, #stats td { text-align: right; padding: 3px 6px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  #stats th:first-child, #stats td:first-child { text-align: left; }
</style>
<script>
/* rep-engine 0.1.0, inlined by build/build.mjs. Edit engine/, not this copy. */
// ---- engine/core.js ----
// rep-engine core: namespace, landmark indices, small shared helpers.
// Every engine file is a plain script that adds to globalThis.RepEngine,
// so the build step can concatenate them into one inline <script>.
(function (g) {
  'use strict';
  const RE = (g.RepEngine = g.RepEngine || {});

  RE.version = '0.1.0';

  // MediaPipe Pose landmark indices (33-point model). "Left" and "right"
  // are the player's own anatomical sides.
  RE.LM = Object.freeze({
    NOSE: 0,
    L_SHOULDER: 11, R_SHOULDER: 12,
    L_ELBOW: 13, R_ELBOW: 14,
    L_WRIST: 15, R_WRIST: 16,
    L_HIP: 23, R_HIP: 24,
    L_KNEE: 25, R_KNEE: 26,
    L_ANKLE: 27, R_ANKLE: 28,
  });

  // Knees-up framing: these must be visible for calibration and signals.
  RE.REQUIRED = Object.freeze([11, 12, 23, 24, 25, 26]);

  RE.LM_NAMES = Object.freeze({
    0: 'nose', 11: 'left shoulder', 12: 'right shoulder', 13: 'left elbow',
    14: 'right elbow', 15: 'left wrist', 16: 'right wrist', 23: 'left hip',
    24: 'right hip', 25: 'left knee', 26: 'right knee', 27: 'left ankle', 28: 'right ankle',
  });

  // Skeleton lines for the debug overlay (upper body, torso, legs).
  RE.CONNECTIONS = Object.freeze([
    [11, 12], [11, 13], [13, 15], [12, 14], [14, 16],
    [11, 23], [12, 24], [23, 24],
    [23, 25], [25, 27], [24, 26], [26, 28],
  ]);

  RE.clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  RE.now = () => (g.performance && g.performance.now ? g.performance.now() : Date.now());

  // Tiny event emitter. on('*', fn) receives (name, payload) for every event.
  RE.createEmitter = function () {
    const handlers = new Map();
    return {
      on(name, fn) {
        if (!handlers.has(name)) handlers.set(name, new Set());
        handlers.get(name).add(fn);
        return () => handlers.get(name).delete(fn);
      },
      emit(name, payload) {
        const set = handlers.get(name);
        if (set) for (const fn of [...set]) safeCall(fn, payload);
        const all = handlers.get('*');
        if (all) for (const fn of [...all]) safeCall(fn, name, payload);
      },
      clear() { handlers.clear(); },
    };
  };

  function safeCall(fn, a, b) {
    try { fn(a, b); } catch (err) { (g.console || { error() {} }).error('[rep-engine] handler error', err); }
  }

  // Storage that never throws: private windows, blocked storage and Node
  // all fall back to an in-memory map for the session.
  RE.storage = (function () {
    const memory = new Map();
    function ls() {
      try { return g.localStorage || null; } catch (_) { return null; }
    }
    return {
      get(key) {
        try { const s = ls(); if (s) { const v = s.getItem(key); if (v !== null) return v; } } catch (_) {}
        return memory.has(key) ? memory.get(key) : null;
      },
      set(key, value) {
        memory.set(key, value);
        try { const s = ls(); if (s) s.setItem(key, value); } catch (_) {}
      },
      remove(key) {
        memory.delete(key);
        try { const s = ls(); if (s) s.removeItem(key); } catch (_) {}
      },
    };
  })();

  // Throttled spoken cues for calibration ("step back", "good").
  RE.speak = (function () {
    let lastText = '';
    let lastAt = 0;
    return function (text, minGapMs = 2500) {
      const synth = g.speechSynthesis;
      if (!synth || typeof g.SpeechSynthesisUtterance !== 'function') return false;
      const t = RE.now();
      if (text === lastText && t - lastAt < minGapMs) return false;
      lastText = text;
      lastAt = t;
      try {
        synth.cancel();
        synth.speak(new g.SpeechSynthesisUtterance(text));
        return true;
      } catch (_) { return false; }
    };
  })();
})(globalThis);

// ---- engine/config.js ----
// Every tunable number lives here. A player profile stores only overrides.
// Values are starting points from the spec, not tested results.
(function (g) {
  'use strict';
  const RE = g.RepEngine;

  const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.1.1';

  RE.defaultConfig = function () {
    return {
      pose: {
        moduleUrl: MP + '/vision_bundle.mjs',
        wasmBase: MP + '/wasm',
        modelUrl: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
        delegate: 'GPU', // falls back to CPU automatically if GPU init fails
        minPoseDetectionConfidence: 0.5,
        minPosePresenceConfidence: 0.5,
        minTrackingConfidence: 0.5,
      },
      camera: { idealWidth: 1280, idealHeight: 720 },
      smoothing: { minCutoff: 1.0, beta: 0.02, dCutoff: 1.0 },
      visibility: {
        hold: 0.5,    // below this a landmark holds its last value
        framing: 0.6, // required landmarks must beat this to pass framing
      },
      calibration: {
        framingHoldMs: 1000,
        baselineMs: 3000,
        frameMargin: 0.02,   // landmarks this close to the edge count as out of frame
        driftRatio: 0.15,    // shoulder width change that suggests re-baseline
        driftHoldMs: 3000,
      },
      signals: {
        squatFullDrop: 0.5, // hip drop (in T) that reads as squat_depth 1
      },
      demo: {
        doubleTapMs: 350,
        runHoldMs: 250,
        runCadence: 170,
        cadenceWindowMs: 3000,
      },
      recorder: { maxMs: 30000, decimals: 4 },
      overlay: { eventLogSize: 10 },
    };
  };

  // Camera presets. mirrorDisplay only flips what the player sees; the math
  // uses anatomical sides, so it never depends on mirroring.
  RE.presets = Object.freeze({
    living_room: { id: 'living_room', label: 'Living room', facingMode: 'user', mirrorDisplay: true, distanceFt: 4 },
    garage: { id: 'garage', label: 'Garage', facingMode: 'user', mirrorDisplay: true, distanceFt: 6 },
    custom: { id: 'custom', label: 'Custom', facingMode: 'user', mirrorDisplay: true, distanceFt: null },
  });

  // Deep merge for config overrides (plain objects only).
  RE.mergeConfig = function merge(base, overrides) {
    if (!overrides) return base;
    const out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
    for (const key of Object.keys(overrides)) {
      const b = base ? base[key] : undefined;
      const o = overrides[key];
      out[key] = b && o && typeof b === 'object' && typeof o === 'object' && !Array.isArray(o)
        ? merge(b, o)
        : o;
    }
    return out;
  };
})(globalThis);

// ---- engine/one-euro.js ----
// One Euro filter (Casiez et al. 2012) plus a per-landmark smoother with
// visibility gating. Low visibility holds the last good value and flags it.
(function (g) {
  'use strict';
  const RE = g.RepEngine;

  function alpha(cutoff, dt) {
    const tau = 1 / (2 * Math.PI * cutoff);
    return 1 / (1 + tau / dt);
  }

  class OneEuroFilter {
    constructor({ minCutoff = 1.0, beta = 0.02, dCutoff = 1.0 } = {}) {
      this.minCutoff = minCutoff;
      this.beta = beta;
      this.dCutoff = dCutoff;
      this.reset();
    }
    reset() { this.x = null; this.dx = 0; this.t = null; }
    // value: number, tSec: timestamp in seconds
    filter(value, tSec) {
      if (this.x === null) { this.x = value; this.t = tSec; return value; }
      const dt = Math.max(tSec - this.t, 1e-3);
      this.t = tSec;
      const rawDx = (value - this.x) / dt;
      this.dx += alpha(this.dCutoff, dt) * (rawDx - this.dx);
      const cutoff = this.minCutoff + this.beta * Math.abs(this.dx);
      this.x += alpha(cutoff, dt) * (value - this.x);
      return this.x;
    }
  }
  RE.OneEuroFilter = OneEuroFilter;

  // Smooths pixel landmarks (x, y) and world landmarks (x, y, z).
  // Input points: {x, y, v} pixels; world: {x, y, z, v} meters (or null).
  // scale: pixels per body unit (shoulder width). Filtering happens in
  // body-scaled units so the One Euro speed term behaves the same whether
  // the player fills a portrait phone or a landscape tablet.
  class LandmarkSmoother {
    constructor(smoothing, holdVisibility) {
      this.cfg = smoothing;
      this.hold = holdVisibility;
      this.reset();
    }
    reset() {
      this.px = new Map();   // index -> [fx, fy]
      this.wl = new Map();   // index -> [fx, fy, fz]
      this.last = new Map(); // index -> last good smoothed point
      this.lastW = new Map();
    }
    _filters(map, idx, n) {
      if (!map.has(idx)) map.set(idx, Array.from({ length: n }, () => new OneEuroFilter(this.cfg)));
      return map.get(idx);
    }
    // Returns {points, world, held:Set<index>}
    update(points, world, tSec, scale = 1) {
      const k = scale > 0 ? scale : 1;
      const outP = new Array(points.length);
      const outW = world ? new Array(world.length) : null;
      const held = new Set();
      for (let i = 0; i < points.length; i++) {
        const p = points[i];
        if (p.v < this.hold && this.last.has(i)) {
          // hold the last good value; detectors that need it pause
          outP[i] = Object.assign({}, this.last.get(i), { v: p.v, held: true });
          held.add(i);
        } else {
          const [fx, fy] = this._filters(this.px, i, 2);
          const s = { x: fx.filter(p.x / k, tSec) * k, y: fy.filter(p.y / k, tSec) * k, v: p.v, held: false };
          if (p.v >= this.hold) this.last.set(i, s);
          outP[i] = s;
        }
        if (outW && world[i]) {
          const w = world[i];
          if (w.v < this.hold && this.lastW.has(i)) {
            outW[i] = Object.assign({}, this.lastW.get(i), { v: w.v, held: true });
          } else {
            const [a, b, c] = this._filters(this.wl, i, 3);
            const s = { x: a.filter(w.x, tSec), y: b.filter(w.y, tSec), z: c.filter(w.z, tSec), v: w.v, held: false };
            if (w.v >= this.hold) this.lastW.set(i, s);
            outW[i] = s;
          }
        }
      }
      return { points: outP, world: outW, held };
    }
  }
  RE.LandmarkSmoother = LandmarkSmoother;
})(globalThis);

// ---- engine/normalize.js ----
// Body-unit normalization. Every signal is measured in the player's own
// units so portrait phone, landscape tablet and TV mirroring all agree:
//   S = calibrated shoulder width (horizontal values are divided by S)
//   T = calibrated torso length, shoulder midpoint to hip midpoint
//       (vertical values are divided by T)
//   origin = calibrated hip midpoint, +x = player's right, +y = up
(function (g) {
  'use strict';
  const RE = g.RepEngine;

  // MediaPipe gives x and y as 0-1 fractions of width and height. Those are
  // not square, so convert to pixels before measuring any distance.
  RE.toPixels = function (lm, w, h) {
    return { x: lm[0] * w, y: lm[1] * h, v: lm[3] == null ? 1 : lm[3] };
  };

  RE.framePixels = function (raw) {
    if (!raw || !raw.lm) return null;
    return raw.lm.map((lm) => RE.toPixels(lm, raw.w, raw.h));
  };

  RE.frameWorld = function (raw) {
    if (!raw || !raw.wl) return null;
    return raw.wl.map((p) => ({ x: p[0], y: p[1], z: p[2], v: p[3] == null ? 1 : p[3] }));
  };

  RE.mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
  RE.dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  RE.orientationOf = (w, h) => (w >= h ? 'landscape' : 'portrait');

  // side: +1 when the player's right appears at larger image x. Measured from
  // the shoulders at calibration, so a mirrored or unmirrored feed both work.
  RE.toBody = function (p, cal) {
    return {
      x: (cal.side * (p.x - cal.hipMidX)) / cal.shoulderWidth,
      y: (cal.hipMidY - p.y) / cal.torsoLength, // image y grows down; flip so up is positive
    };
  };

  // Angle at joint b (degrees) from three 3D world points.
  RE.jointAngle = function (a, b, c) {
    const v1 = [a.x - b.x, a.y - b.y, a.z - b.z];
    const v2 = [c.x - b.x, c.y - b.y, c.z - b.z];
    const dot = v1[0] * v2[0] + v1[1] * v2[1] + v1[2] * v2[2];
    const n = Math.hypot(...v1) * Math.hypot(...v2);
    if (n === 0) return 180;
    return (Math.acos(RE.clamp(dot / n, -1, 1)) * 180) / Math.PI;
  };
})(globalThis);

// ---- engine/signals.js ----
// Per-frame continuous signals from smoothed pixel landmarks + calibration.
// Milestone 1 computes the position signals (lean, squat depth, knee lift,
// confidence, drift). Cadence, effort, speed and guard arrive with the
// gesture detectors in milestone 2.
(function (g) {
  'use strict';
  const RE = g.RepEngine;
  const L = RE.LM;

  // Lowest visibility among required landmarks, plus which are missing.
  RE.confidenceOf = function (points, threshold) {
    let min = 1;
    const missing = [];
    for (const i of RE.REQUIRED) {
      const v = points[i] ? points[i].v : 0;
      if (v < min) min = v;
      if (v < threshold) missing.push(RE.LM_NAMES[i]);
    }
    return { confidence: Math.max(0, min), missing };
  };

  RE.computeSignals = function (points, cal, cfg) {
    const { confidence, missing } = RE.confidenceOf(points, cfg.visibility.hold);
    const out = { confidence, missing, calibrated: !!cal };
    if (!cal) return out;

    const b = (i) => RE.toBody(points[i], cal);
    const ls = b(L.L_SHOULDER), rs = b(L.R_SHOULDER);
    const lh = b(L.L_HIP), rh = b(L.R_HIP);
    const lk = b(L.L_KNEE), rk = b(L.R_KNEE);
    const sMid = { x: (ls.x + rs.x) / 2, y: (ls.y + rs.y) / 2 };
    const hMid = { x: (lh.x + rh.x) / 2, y: (lh.y + rh.y) / 2 };

    // lean: shoulder midpoint minus hip midpoint, in S. + = leaning to player's right
    out.lean = sMid.x - hMid.x;
    // hip drop below the calibrated standing hip height, in T
    out.hipDrop = -hMid.y;
    out.squatDepth = RE.clamp(out.hipDrop / cfg.signals.squatFullDrop, 0, 1);
    // knee lift above standing knee height, in T
    out.kneeLiftL = lk.y - cal.kneeBaseL;
    out.kneeLiftR = rk.y - cal.kneeBaseR;
    // shoulder width now vs calibration: drifts when the player moves closer/farther
    out.shoulderRatio = RE.dist(points[L.L_SHOULDER], points[L.R_SHOULDER]) / cal.shoulderWidth;
    out.body = { ls, rs, lh, rh, lk, rk, sMid, hMid };
    return out;
  };
})(globalThis);

// ---- engine/calibration.js ----
// Calibration: framing check -> baseline capture -> move test -> saved profile.
// One profile per camera preset and orientation, because the pixel baseline
// only means something for the framing it was captured in.
(function (g) {
  'use strict';
  const RE = g.RepEngine;
  const L = RE.LM;

  // Move test prompts from the spec. A prompt only runs once a detector for
  // its event is registered (milestone 2); until then the step is skipped.
  RE.MOVE_TEST = Object.freeze([
    { id: 'march', prompt: 'March four steps', event: 'step', count: 4 },
    { id: 'high_knees', prompt: 'Two high knees', event: 'run_start', count: 1 },
    { id: 'lean_left', prompt: 'Lean left', event: 'lean_left', count: 1 },
    { id: 'lean_right', prompt: 'Lean right', event: 'lean_right', count: 1 },
    { id: 'point_left', prompt: 'Point left', event: 'point', match: { side: 'left' }, count: 1 },
    { id: 'point_right', prompt: 'Point right', event: 'point', match: { side: 'right' }, count: 1 },
    { id: 'squat', prompt: 'One squat', event: 'squat', count: 1 },
    { id: 'jab_cross', prompt: 'Jab, cross', event: 'strike', count: 2 },
  ]);

  // Event names whose detectors exist. Milestone 2 adds to this set.
  RE.detectors = RE.detectors || new Set();

  function median(values) {
    const s = values.slice().sort((a, b) => a - b);
    const m = s.length >> 1;
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }

  // Why framing fails right now, or null if it passes.
  RE.framingProblem = function (points, w, h, cfg) {
    if (!points) return { code: 'no_person', prompt: 'Step into view' };
    const margin = cfg.calibration.frameMargin;
    const low = [];
    let outOfFrame = false;
    for (const i of RE.REQUIRED) {
      const p = points[i];
      if (!p || p.v < cfg.visibility.framing) { low.push(RE.LM_NAMES[i]); continue; }
      if (p.x < w * margin || p.x > w * (1 - margin) || p.y < h * margin || p.y > h * (1 - margin)) outOfFrame = true;
    }
    if (low.some((n) => n.includes('knee')) || outOfFrame) return { code: 'step_back', prompt: 'Step back', missing: low };
    if (low.length) return { code: 'low_visibility', prompt: 'Face the camera', missing: low };
    return null;
  };

  class Calibrator {
    constructor(cfg, presetId) {
      this.cfg = cfg;
      this.presetId = presetId;
      this.state = 'framing';
      this.framingSince = null;
      this.baselineSince = null;
      this.samples = [];
      this.result = null;
      this.testIndex = 0;
      this.testHits = 0;
      this.tests = RE.MOVE_TEST.filter((t) => RE.detectors.has(t.event));
      this.skippedTests = RE.MOVE_TEST.length - this.tests.length;
    }

    // frame: {points (smoothed px), w, h, t (ms)}. Returns a status object.
    update(frame) {
      const { points, w, h, t } = frame;
      if (this.state === 'done') return this.status();
      if (this.state === 'move_test') return this.status();

      const problem = RE.framingProblem(points, w, h, this.cfg);
      if (problem) {
        this.framingSince = null;
        if (this.state === 'baseline') { this.state = 'framing'; this.samples = []; this.baselineSince = null; }
        this.problem = problem;
        return this.status();
      }
      this.problem = null;

      if (this.state === 'framing') {
        if (this.framingSince === null) this.framingSince = t;
        if (t - this.framingSince >= this.cfg.calibration.framingHoldMs) {
          this.state = 'baseline';
          this.baselineSince = t;
          this.samples = [];
        }
        return this.status(t);
      }

      if (this.state === 'baseline') {
        this.samples.push(sample(points, w, h));
        if (t - this.baselineSince >= this.cfg.calibration.baselineMs) {
          this.result = this._finish(w, h);
          this.state = this.tests.length ? 'move_test' : 'done';
        }
        return this.status(t);
      }
      return this.status(t);
    }

    // Engine forwards gesture events here during the move test.
    onEvent(name, payload) {
      if (this.state !== 'move_test') return;
      const test = this.tests[this.testIndex];
      if (!test || test.event !== name) return;
      if (test.match && !Object.keys(test.match).every((k) => payload && payload[k] === test.match[k])) return;
      this.testHits++;
      if (this.testHits >= test.count) {
        this.testIndex++;
        this.testHits = 0;
        if (this.testIndex >= this.tests.length) this.state = 'done';
      }
    }

    skipTest() {
      if (this.state !== 'move_test') return;
      this.testIndex++;
      this.testHits = 0;
      if (this.testIndex >= this.tests.length) this.state = 'done';
    }

    status(t) {
      const c = this.cfg.calibration;
      let progress = 0;
      let prompt = '';
      if (this.state === 'framing') {
        prompt = this.problem ? this.problem.prompt : 'Hold still';
        progress = this.framingSince !== null && t != null ? RE.clamp((t - this.framingSince) / c.framingHoldMs, 0, 1) : 0;
      } else if (this.state === 'baseline') {
        prompt = 'Stand tall, arms at your sides';
        progress = t != null ? RE.clamp((t - this.baselineSince) / c.baselineMs, 0, 1) : 0;
      } else if (this.state === 'move_test') {
        const test = this.tests[this.testIndex];
        prompt = test ? test.prompt : '';
        progress = this.testIndex / this.tests.length;
      } else if (this.state === 'done') {
        prompt = 'Calibrated';
        progress = 1;
      }
      return {
        state: this.state,
        prompt,
        progress,
        problem: this.problem ? this.problem.code : null,
        missing: this.problem && this.problem.missing ? this.problem.missing : [],
        skippedTests: this.skippedTests,
        result: this.state === 'done' ? this.result : null,
      };
    }

    _finish(w, h) {
      const m = (k) => median(this.samples.map((s) => s[k]));
      const cal = {
        version: 1,
        preset: this.presetId,
        orientation: RE.orientationOf(w, h),
        videoW: w,
        videoH: h,

      let y = 8 + pad + rowH / 2;
      const fit = (str) => {
        const max = panelW - pad * 2;
        if (ctx.measureText(str).width <= max) return str;
        let s = str;
        while (s.length > 1 && ctx.measureText(s + '…').width > max) s = s.slice(0, -1);
        return s + '…';
      };
      const text = (str, color = '#fff') => { ctx.fillStyle = color; ctx.fillText(fit(str), 8 + pad, y); y += rowH; };
      text(`${d.source} · ${d.fps ? d.fps.toFixed(0) + ' fps' : '-- fps'} · ${d.mode}`);
      text(d.cal ? `cal ${d.cal.orientation} · S ${d.cal.shoulderWidth.toFixed(0)}px T ${d.cal.torsoLength.toFixed(0)}px` : 'not calibrated', d.cal ? '#cfe' : '#fc8');
      for (const [label, get, lo, hi] of BARS) {
        const v = s ? get(s) : null;
        ctx.fillStyle = '#fff';
        ctx.fillText(label, 8 + pad, y);
        const x0 = 8 + pad + 60, w = bw - 20;
        ctx.fillStyle = 'rgba(255,255,255,.18)';
        ctx.fillRect(x0, y - 5, w, 10);
        if (v != null && isFinite(v)) {
          const f = RE.clamp((v - lo) / (hi - lo), 0, 1);
          ctx.fillStyle = 'rgba(80,220,140,.95)';
          if (lo < 0) {
            const zero = x0 + w / 2;
            const xv = x0 + f * w;
            ctx.fillRect(Math.min(zero, xv), y - 5, Math.abs(xv - zero), 10);
          } else {
            ctx.fillRect(x0, y - 5, f * w, 10);
          }
          ctx.fillStyle = '#fff';
          ctx.fillText(Math.abs(v) >= 10 ? v.toFixed(0) : v.toFixed(2), x0 + w + 8, y);
        }
        y += rowH;
      }
      text(d.calibration ? `calibration: ${d.calibration.state} · ${d.calibration.prompt}` : 'events:', '#ddd');
      for (const line of this.log) text(line, 'rgba(255,255,255,.85)');
      ctx.restore();

      // big centered calibration prompt
      if (d.calibration && d.calibration.state !== 'done') {
        ctx.save();
        ctx.scale(dpr, dpr);
        const msg = d.calibration.prompt;
        ctx.font = '700 28px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const tw = ctx.measureText(msg).width;
        ctx.fillStyle = 'rgba(0,0,0,.6)';
        ctx.fillRect(W / 2 - tw / 2 - 16, H - 92, tw + 32, 48);
        ctx.fillStyle = '#fff';
        ctx.fillText(msg, W / 2, H - 68);
        // progress bar
        ctx.fillStyle = 'rgba(255,255,255,.25)';
        ctx.fillRect(W / 2 - 100, H - 36, 200, 6);
        ctx.fillStyle = 'rgba(80,220,140,.95)';
        ctx.fillRect(W / 2 - 100, H - 36, 200 * d.calibration.progress, 6);
        ctx.restore();
      }
    }

    destroy() {
      g.cancelAnimationFrame(this.raf);
      this.offAll();
      g.removeEventListener('touchstart', this._onTouch);
      g.removeEventListener('keydown', this._onKey);
      this._clear();
    }
  }
  RE.DebugOverlay = DebugOverlay;
})(globalThis);

// ---- engine/engine.js ----
// rep-engine public API. Games call these and never touch landmarks.
//
//   const engine = RepEngine.create({ video, preset: 'living_room' });
//   await engine.start();             // camera + pose
//   await engine.calibrate();         // resolves with the saved profile
//   engine.on('step', ({ leg }) => ...);
//   const s = engine.signals();       // per-frame snapshot
(function (g) {
  'use strict';
  const RE = g.RepEngine;
  const MODES = ['explore', 'combat', 'transit'];

  RE.create = function (opts = {}) {
    const cfg = RE.mergeConfig(RE.defaultConfig(), opts.config);
    const emitter = RE.createEmitter();
    const headless = !!opts.headless;

    const st = {
      presetId: opts.preset && RE.presets[opts.preset] ? opts.preset : 'living_room',
      source: 'idle',          // idle | camera | replay | demo
      sourceObj: null,
      mode: 'explore',
      combatTarget: null,
      cal: null,
      profileChecked: new Set(),
      calibrator: null,
      calStatus: null,
      calPromise: null,
      lastPrompt: '',
      scaleRef: null,
      smoother: new RE.LandmarkSmoother(cfg.smoothing, cfg.visibility.hold),
      drift: new RE.DriftMonitor(cfg),
      recorder: new RE.Recorder(cfg),
      demoInput: null,
      demoUi: null,
      frame: null,
      raw: null,
      sig: null,
      lowConfidence: false,
      snapshot: emptySnapshot(),
      session: { startedAt: null, frames: 0, counts: {} },
    };

    // Count every event for the session summary and feed the move test.
    emitter.on('*', (name, payload) => {
      if (name === 'frame' || name === 'calibration') return;
      st.session.counts[name] = (st.session.counts[name] || 0) + 1;
      if (st.calibrator) st.calibrator.onEvent(name, payload);
    });

    function preset() { return RE.presets[st.presetId]; }

    function setCal(cal) {
      st.cal = cal;
      st.drift.reset();
      // Smooth in calibrated body scale from now on (see LandmarkSmoother).
      st.scaleRef = cal ? cal.shoulderWidth : null;
      st.smoother.reset();
    }

    function ingest(raw) {
      st.raw = raw;
      st.session.frames++;
      if (st.session.startedAt === null) st.session.startedAt = raw.t;

      if (st.recorder.active && st.recorder.push(raw)) {
        emitter.emit('recording_done', { clip: st.recorder.stop() });
      }

      const orient = raw.w && raw.h ? RE.orientationOf(raw.w, raw.h) : null;
      if (orient) checkProfile(orient);

      const px = RE.framePixels(raw);
      let points = null;
      let world = null;
      if (px) {
        if (!st.scaleRef) {
          const ls = px[RE.LM.L_SHOULDER], rs = px[RE.LM.R_SHOULDER];
          if (ls.v >= cfg.visibility.hold && rs.v >= cfg.visibility.hold) st.scaleRef = RE.dist(ls, rs) || null;
        }
        const sm = st.smoother.update(px, RE.frameWorld(raw), raw.t / 1000, st.scaleRef || 1);
        points = sm.points;
        world = sm.world;
      }
      st.frame = { t: raw.t, w: raw.w, h: raw.h, points, world };

      if (st.calibrator) runCalibrator();

      const sig = points ? RE.computeSignals(points, st.cal, cfg) : { confidence: 0, missing: RE.REQUIRED.map((i) => RE.LM_NAMES[i]), calibrated: !!st.cal };
      st.sig = sig;

      // confidence transitions
      const low = sig.confidence < cfg.visibility.hold;
      if (low && !st.lowConfidence) emitter.emit('low_confidence', { missing: sig.missing });
      if (!low && st.lowConfidence) emitter.emit('confidence_ok', {});
      st.lowConfidence = low;

      // drift: player moved closer or farther than the baseline
      if (st.cal && !low && st.drift.update(sig.shoulderRatio, raw.t)) {
        emitter.emit('recalibrate_suggested', { reason: 'distance', shoulderRatio: sig.shoulderRatio });
      }

      if (st.source !== 'demo') {
        st.snapshot = Object.assign(emptySnapshot(), {
          lean: sig.lean != null && !low ? sig.lean : 0,
          squat_depth: sig.squatDepth != null && !low ? sig.squatDepth : 0,
          confidence: sig.confidence,
        });
      }
      emitter.emit('frame', st.snapshot);
    }

    function checkProfile(orient) {
      if (st.cal && st.cal.orientation !== orient) {
        // device rotated: switch to that orientation's profile if there is one
        const p = RE.profiles.load(st.presetId, orient);
        setCal(p);
        st.profileChecked.add(orient);
        emitter.emit('orientation_change', { orientation: orient, calibrated: !!p });
        if (!p) emitter.emit('recalibrate_needed', { reason: 'orientation', orientation: orient });
        return;
      }
      if (!st.cal && !st.profileChecked.has(orient) && !st.calibrator) {
        st.profileChecked.add(orient);
        const p = RE.profiles.load(st.presetId, orient);
        if (p) { setCal(p); emitter.emit('calibrated', { cal: p, fromProfile: true }); }
      }
    }

    function runCalibrator() {
      const status = st.calibrator.update(st.frame);
      st.calStatus = status;
      emitter.emit('calibration', status);
      if (!headless && status.prompt && status.prompt !== st.lastPrompt) {
        st.lastPrompt = status.prompt;
        RE.speak(status.state === 'baseline' ? 'Good. Hold still.' : status.prompt);
      }
      if (status.state === 'done') {
        const cal = status.result;
        RE.profiles.save(cal);
        st.calibrator = null;
        setCal(cal);
        st.profileChecked.add(cal.orientation);
        emitter.emit('calibrated', { cal, fromProfile: false, skippedTests: status.skippedTests });
        if (st.calPromise) { st.calPromise.resolve(cal); st.calPromise = null; }
      }
    }

    function stopSource() {
      if (st.sourceObj && st.sourceObj.stop) st.sourceObj.stop();
      st.sourceObj = null;
      if (st.source !== 'demo') st.source = 'idle';
    }

    const api = {
      cfg,
      presets: RE.presets,

      // Start live camera tracking. Needs opts.video (a <video> element).
      async start(presetId) {
        if (presetId && RE.presets[presetId]) st.presetId = presetId;
        if (!opts.video) throw new Error('RepEngine.create needs { video } for camera mode');
        api.disable_demo();
        stopSource();
        const cam = new RE.CameraPoseSource(cfg);
        st.sourceObj = cam;
        st.source = 'camera';
        await cam.start(opts.video, preset(), ingest, (msg) => emitter.emit('status', { message: msg }));
      },

      // Replay a recorded clip through the full pipeline.
      start_replay(clip, { realtime = true } = {}) {
        api.disable_demo();
        stopSource();
        st.source = 'replay';
        return new Promise((resolve) => {
          const done = () => { st.source = 'idle'; emitter.emit('replay_end', {}); resolve(); };
          if (!realtime) { RE.replaySync(clip, ingest); done(); return; }
          const r = new RE.ReplayPoseSource(clip);
          st.sourceObj = r;
          r.start(ingest, done);
        });
      },

      stop() { stopSource(); api.disable_demo(); },

      // Runs framing check, baseline capture and move test. Resolves with
      // the saved profile.
      calibrate(presetId) {
        if (presetId && RE.presets[presetId]) st.presetId = presetId;
        if (st.calPromise) st.calPromise.reject(new Error('calibration restarted'));
        st.calibrator = new RE.Calibrator(cfg, st.presetId);
        st.lastPrompt = '';
        return new Promise((resolve, reject) => { st.calPromise = { resolve, reject }; });
      },
      skip_move_test() { if (st.calibrator) st.calibrator.skipTest(); },
      cancel_calibration() {
        st.calibrator = null;
        st.calStatus = null;
        if (st.calPromise) { st.calPromise.reject(new Error('calibration cancelled')); st.calPromise = null; }
      },
      clear_profile() {
        const o = st.cal ? st.cal.orientation : st.frame ? RE.orientationOf(st.frame.w, st.frame.h) : null;
        if (o) RE.profiles.clear(st.presetId, o);
        setCal(null);
        st.profileChecked.clear();
      },
      is_calibrated: () => !!st.cal,

      enable_demo(container) {
        if (st.demoInput) return;
        stopSource();
        st.source = 'demo';
        st.demoInput = new RE.DemoInput(cfg, (name, payload) => emitter.emit(name, payload));
        if (container) st.demoUi = new RE.DemoController(container, st.demoInput);
        if (st.session.startedAt === null) st.session.startedAt = RE.now();
      },
      disable_demo() {
        if (!st.demoInput) return;
        st.demoInput.destroy();
        if (st.demoUi) st.demoUi.destroy();
        st.demoInput = null;
        st.demoUi = null;
        if (st.source === 'demo') st.source = 'idle';
        st.snapshot = emptySnapshot();
      },

      on: (name, fn) => emitter.on(name, fn),

      signals() {
        if (st.source === 'demo' && st.demoInput) st.snapshot = st.demoInput.signals(RE.now());
        return Object.assign({}, st.snapshot);
      },

      set_mode(mode) {
        if (!MODES.includes(mode)) throw new Error('unknown mode ' + mode);
        if (mode === st.mode) return;
        st.mode = mode;
        if (mode !== 'combat') st.combatTarget = null;
        emitter.emit('mode', { mode });
      },
      enter_combat(target) { st.combatTarget = target || null; api.set_mode('combat'); },
      exit_combat() { api.set_mode('explore'); },
      mode: () => st.mode,

      start_recording(meta) { st.recorder.start(Object.assign({ preset: st.presetId }, meta)); },
      stop_recording() { return st.recorder.stop(); },
      is_recording: () => st.recorder.active,
      recording_ms: () => st.recorder.elapsedMs,

      // Milestone 1 summary; work/rest split and per-gesture reps fill in
      // as detectors land.
      session_summary() {
        const end = st.raw ? st.raw.t : RE.now();
        return {
          startedAt: st.session.startedAt,
          durationMs: st.session.startedAt === null ? 0 : Math.max(0, end - st.session.startedAt),
          frames: st.session.frames,
          events: Object.assign({}, st.session.counts),
        };
      },

      // Debug view for the overlay and tests. Games should not depend on it.
      debug() {
        return {
          source: st.source,
          mode: st.mode,
          preset: st.presetId,
          mirror: preset().mirrorDisplay,
          fps: st.sourceObj && st.sourceObj.fps ? st.sourceObj.fps : 0,
          delegate: st.sourceObj && st.sourceObj.delegate ? st.sourceObj.delegate : null,
          frame: st.frame,
          raw: st.raw,
          cal: st.cal,
          calibration: st.calibrator ? st.calStatus : null,
          signals: api.signals(),
          rawSignals: st.sig,
        };
      },

      // Feed one raw frame directly (tests and custom sources).
      _ingest: ingest,
    };
    return api;
  };

  function emptySnapshot() {
    return { cadence_spm: 0, effort: 0, speed: 0, lean: 0, squat_depth: 0, guard_up: false, confidence: 0 };
  }
})(globalThis);
</script>
</head>
<body>
<header>
  <h1>rep-engine lab</h1>
  <div class="row">
    <select id="preset" aria-label="Camera preset"></select>
    <button id="camera" class="primary">Start camera</button>
    <button id="demoBtn">Demo mode</button>
    <button id="calibrate" disabled>Calibrate</button>
    <button id="record" disabled>Record 30 s</button>
    <label class="file">Replay clip<input id="clipFile" type="file" accept=".json,application/json"></label>
    <button id="clearProfile">Clear profile</button>
    <button id="stop">Stop</button>
  </div>
  <div id="status">Prop the phone up, then start the camera. Three-finger tap toggles the overlay.</div>
</header>
<div id="stage">
  <video id="video" playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="demo"></div>
</div>
<div id="stats" hidden></div>

<script>
(function () {
  'use strict';
  const RE = window.RepEngine;
  const $ = (id) => document.getElementById(id);
  const video = $('video'), canvas = $('overlay'), status = $('status');
  const presetSel = $('preset');

  for (const p of Object.values(RE.presets)) {
    const o = document.createElement('option');
    o.value = p.id;
    o.textContent = p.label + (p.distanceFt ? ` (${p.distanceFt} ft)` : '');
    presetSel.appendChild(o);
  }

  const engine = RE.create({ video, preset: presetSel.value });
  new RE.DebugOverlay(canvas, engine);

  const say = (msg) => { status.textContent = msg; };
  const setLive = (live) => { $('calibrate').disabled = !live; $('record').disabled = !live; };

  engine.on('status', (e) => say(e.message));
  engine.on('calibrated', (e) => {
    const c = e.cal;
    const extra = e.skippedTests ? ` Move test skipped (${e.skippedTests} prompts unlock with milestone 2 detectors).` : '';
    say(`${e.fromProfile ? 'Loaded saved' : 'Saved'} ${c.orientation} profile: S ${c.shoulderWidth.toFixed(0)} px, T ${c.torsoLength.toFixed(0)} px.${extra}`);
  });
  engine.on('recalibrate_needed', (e) => say(`No ${e.orientation} profile yet. Tap Calibrate.`));
  engine.on('recalibrate_suggested', () => say('You moved closer or farther than your baseline. Tap Calibrate to re-baseline.'));
  engine.on('recording_done', (e) => { finishRecording(e.clip); });

  $('camera').addEventListener('click', async () => {
    video.classList.toggle('mirror', !!RE.presets[presetSel.value].mirrorDisplay);
    try {
      await engine.start(presetSel.value);
      setLive(true);
      say(engine.is_calibrated() ? 'Tracking with your saved profile.' : 'Tracking. Tap Calibrate.');
    } catch (err) {
      say('Camera failed: ' + err.message);
    }
  });

  $('demoBtn').addEventListener('click', () => {
    engine.enable_demo($('demo'));
    setLive(false);
    say('Demo mode: left zone marches, right zone leans, buttons fire events.');
  });

  $('calibrate').addEventListener('click', () => {
    say('Calibrating: step back until shoulders, hips and knees are in frame.');
    engine.calibrate(presetSel.value).catch(() => {});
  });

  let recording = false;
  const recBtn = $('record');
  recBtn.addEventListener('click', () => {
    if (!recording) {
      engine.start_recording({ preset: presetSel.value, userAgent: navigator.userAgent });
      recording = true;
      recBtn.textContent = 'Stop and save';
      recBtn.classList.add('rec');
      say('Recording up to 30 s.');
    } else {
      finishRecording(engine.stop_recording());
    }
  });
  function finishRecording(clip) {
    recording = false;
    recBtn.textContent = 'Record 30 s';
    recBtn.classList.remove('rec');
    RE.downloadClip(clip);
    say(`Saved ${clip.meta.frameCount} frames (${(clip.meta.durationMs / 1000).toFixed(1)} s, ${clip.meta.orientation}).`);
  }

  // Replay a clip, calibrate from its first seconds, and summarize signals so
  // a portrait and a landscape recording of the same movement can be compared.
  const summaries = [];
  $('clipFile').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    let clip;
    try { clip = RE.validateClip(JSON.parse(await file.text())); } catch (err) { say('Could not read clip: ' + err.message); return; }
    video.classList.remove('mirror');
    setLive(false);
    const acc = { name: file.name, orientation: clip.meta.orientation, frames: 0, lean: [Infinity, -Infinity], squat: 0, kneeL: 0, kneeR: 0 };
    const off = engine.on('frame', () => {
      const s = engine.debug().rawSignals;
      if (!s || s.lean == null) return;
      acc.frames++;
      acc.lean = [Math.min(acc.lean[0], s.lean), Math.max(acc.lean[1], s.lean)];
      acc.squat = Math.max(acc.squat, s.squatDepth);
      acc.kneeL = Math.max(acc.kneeL, s.kneeLiftL);
      acc.kneeR = Math.max(acc.kneeR, s.kneeLiftR);
    });
    say(`Replaying ${file.name}. Stand still for the first 4 s of a clip so it can calibrate.`);
    engine.calibrate(presetSel.value).catch(() => {});
    await engine.start_replay(clip, { realtime: true });
    off();
    engine.cancel_calibration();
    summaries.unshift(acc);
    summaries.length = Math.min(summaries.length, 2);
    renderStats();
    say(acc.frames ? `Replay done: ${acc.frames} calibrated frames.` : 'Replay done, but the clip never calibrated. Start clips standing still.');
  });

  function renderStats() {
    const el = $('stats');
    el.hidden = false;
    const f = (v) => (isFinite(v) ? v.toFixed(2) : '--');
    const rows = [
      ['orientation', (s) => s.orientation || '--'],
      ['calibrated frames', (s) => s.frames],
      ['lean min', (s) => f(s.lean[0])],
      ['lean max', (s) => f(s.lean[1])],
      ['squat depth max', (s) => f(s.squat)],
      ['knee lift L max', (s) => f(s.kneeL)],
      ['knee lift R max', (s) => f(s.kneeR)],
    ];
    const head = '<tr><th>Signal</th>' + summaries.map((s) => `<th>${escapeHtml(s.name)}</th>`).join('') + '</tr>';
    const body = rows.map(([label, get]) => `<tr><td>${label}</td>` + summaries.map((s) => `<td>${get(s)}</td>`).join('') + '</tr>').join('');
    el.innerHTML = `<table>${head}${body}</table>`;
  }
  const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  $('clearProfile').addEventListener('click', () => { engine.clear_profile(); say('Profile cleared for this preset and orientation.'); });
  $('stop').addEventListener('click', () => { engine.stop(); setLive(false); say('Stopped.'); });
})();
</script>
</body>
</html>
